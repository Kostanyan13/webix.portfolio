<style>
:root{--bg:#05070B;--bg2:#0A0F1A;--p:#146BFF;--b:#2588FF;--t:#9AA6BA;--ln:rgba(80,140,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}

h2{font-size:clamp(30px,5vw,52px);line-height:1.15;font-weight:800;letter-spacing:-.02em}.sub{color:var(--t);max-width:620px;margin:14px 0 48px}

.btn:hover{border-color:var(--b);box-shadow:0 0 28px rgba(20,107,255,.3);transform:translateY(-2px)}
.btn.p{background:linear-gradient(135deg,var(--p),var(--b));border-color:transparent;box-shadow:0 8px 30px rgba(20,107,255,.35)}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(5,7,11,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.hb{display:flex;align-items:center;justify-content:space-between;height:68px}.hb img{height:34px;mix-blend-mode:screen}
nav{display:flex;gap:30px}nav a{color:var(--t);font-size:15px;transition:.2s;position:relative}nav a:hover{color:#fff}

.mm{display:none}
.hero{min-height:100svh;display:flex;align-items:center;padding:130px 0 80px;overflow:hidden;background:radial-gradient(60% 50% at 80% 40%,rgba(20,107,255,.22),transparent 70%),linear-gradient(var(--ln) 1px,transparent 1px) 0 0/72px 72px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/72px 72px;-webkit-mask:none}

.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:36px}
.hw{position:absolute;right:-4%;top:50%;transform:translateY(-50%);width:min(560px,70vw);opacity:.55;pointer-events:none;filter:drop-shadow(0 0 40px rgba(20,107,255,.6))}

.grid{display:grid;gap:20px}.s3{grid-template-columns:repeat(3,1fr)}

.card h4{font-size:21px;margin:18px 0 10px}.card p{color:var(--t);font-size:15px}

.pl{grid-template-columns:repeat(3,1fr)}.pl .btn{width:100%}.pl .card{display:flex;flex-direction:column}.pl h4{margin-top:0}

.pp{margin-bottom:18px}.fr{display:flex;align-items:center;gap:6px;color:var(--t);font-size:13px;margin-bottom:4px}.fr svg{width:16px;height:16px;color:var(--b);animation:nudge 1.6s ease-in-out infinite}@keyframes nudge{50%{transform:translateY(3px)}}.pv{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pv b{font-size:clamp(28px,4vw,34px);font-weight:800;line-height:1.1}.amd{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:rgba(20,107,255,.16);border:1px solid var(--ln);color:var(--b);font-style:normal;font-weight:700;font-size:20px;flex:none}
.idea{text-align:center;padding:70px 30px;border-radius:30px;border:1px solid rgba(37,136,255,.4);background:radial-gradient(60% 120% at 50% 120%,rgba(20,107,255,.45),transparent),var(--bg2);box-shadow:0 0 80px rgba(20,107,255,.15)}
.idea h2{max-width:800px;margin:auto;font-size:clamp(26px,4vw,44px)}.idea p{color:#c4cee0;max-width:620px;margin:20px auto 34px}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:20px}.ct .big{font-size:clamp(18px,2.4vw,28px);font-weight:700;display:block;margin-top:6px;overflow-wrap:anywhere}.ct small{color:var(--t)}.soc{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}.soc a{display:flex;align-items:center;justify-content:center;gap:14px;min-height:72px;padding:0 18px;border-radius:16px;border:1px solid var(--ln);background:rgba(255,255,255,.03);transition:.25s}.soc a:hover{border-color:var(--b);box-shadow:0 0 30px rgba(20,107,255,.3);transform:translateY(-4px)}.soc svg{width:26px;height:26px;color:var(--b);flex:none}
.fg{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}footer{border-top:1px solid var(--ln);padding:48px 0 30px}.fg img{height:32px;mix-blend-mode:screen;display:block}.hb img{cursor:pointer}.fn{display:flex;gap:22px;flex-wrap:wrap;color:var(--t)}.fn a:hover{color:#fff}.fb{display:flex;justify-content:space-between;align-items:center;gap:12px 30px;flex-wrap:wrap;margin-top:32px;padding-top:24px;border-top:1px solid var(--ln);color:var(--t);font-size:14px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media(max-width:1100px){.pr{grid-template-columns:repeat(2,1fr)}}@media(max-width:1000px){.s3,.pl{grid-template-columns:repeat(2,1fr)}.ab{grid-template-columns:1fr}}
@media(max-width:900px){nav,.hb>.btn{display:none}.burger{display:block}.mm{display:block;max-height:0;overflow:hidden;transition:max-height .4s;background:var(--bg)}.open .mm{max-height:480px;border-top:1px solid var(--ln)}.mm a{display:block;padding:14px 20px;color:var(--t)}.mm .btn{margin:10px 20px 18px;color:#fff}section{padding:80px 0}}
@media(max-width:640px){.s3,.pr,.pl,.ct{grid-template-columns:1fr}.ab{padding:28px}.hw{opacity:.25}.soc{gap:10px}.soc a{flex-direction:column;gap:6px;padding:10px 4px;font-size:13px;min-height:78px}.fb{flex-direction:column;align-items:flex-start}}@media(max-width:360px){.w{width:calc(100% - 28px)}.btn{padding:0 16px}.ab{padding:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.hw path{stroke-dashoffset:0}html{scroll-behavior:auto}}
h1,h2,h3,h4,p,li{overflow-wrap:anywhere}.card,.ab>*,.ct>*{min-width:0}img{max-width:100%}
.em{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}@media(min-width:1600px){.w{width:min(1360px,100% - 80px)}body{font-size:17px}}@media(max-height:500px) and (orientation:landscape){.hero{min-height:auto;padding:100px 0 50px}}

<script>(()=>{'use strict';

const SO={instagram:['Instagram','<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/>'],telegram:['Telegram','<path d="M21 4 3 11l5.5 2L10 19l3-3.5 5 3.5z"/>'],whatsapp:['WhatsApp','<path d="M3 21l1.5-5A9 9 0 1 1 8 19.5z"/><path d="M9 9c0 3 3 6 6 6l1-1.5-2-1-1 .7c-1-.4-2-1.4-2.4-2.4l.7-1-1-2z"/>']};
const SV=[['monitor','Բիզնես կայքեր','Ժամանակակից և պրոֆեսիոնալ կայքեր, որոնք ներկայացնում են բիզնեսը, ծառայությունները և առաջարկը ճիշտ ու վստահելի ձևով։'],['refresh','Կայքերի վերափոխում','Հին, չաշխատող կամ ժամանակակից պահանջներին չհամապատասխանող կայքերի վերափոխում՝ նոր դիզայնով, կառուցվածքով և ավելի լավ օգտագործելիությամբ։'],['food','Ռեստորանների և սրահների կայքեր','Հրավերային և ներկայացուցչական կայքեր ռեստորանների, միջոցառումների սրահների և տարբեր միջոցառումների համար։'],['mega','Գովազդային կայքեր','Վաճառքի, ծառայության կամ հատուկ առաջարկի համար ստեղծված նպատակային կայքեր, որոնք կենտրոնանում են այցելուների ուշադրության և գործողության վրա։'],['spark','Անհատական վեբ նախագծեր','Յուրաքանչյուր բիզնեսի գաղափարին համապատասխան անհատական վեբ լուծումներ՝ առանց պատրաստի կաղապարի սահմանափակումների։'],['layout','Landing Pages','Կոմպակտ և նպատակային էջեր՝ ծառայություն, ապրանք, առաջարկ կամ գովազդային արշավ ներկայացնելու համար։']];
const D={
services:SV.map(([i,t,d])=>({i,t,d})),
